<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>404 · Cream &amp; Rouge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Outfit:wght@300;400&display=swap">
<style>
:root{--bg:#FFFFFF;--ink:#141414;--mute:#5A5A5A;--line:#E7E7E7;--rouge:#A3162E;--serif:"Cormorant Garamond","Times New Roman",serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101010;--ink:#ECECEC;--mute:#9C9C9C;--line:#272727;--rouge:#E8566B}}
:root[data-theme="dark"]{--bg:#101010;--ink:#ECECEC;--mute:#9C9C9C;--line:#272727;--rouge:#E8566B}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:300 17px/1.7 "Outfit",system-ui,sans-serif;display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--rouge);outline-offset:3px}
header{display:flex;justify-content:flex-end;padding:12px 5vw}
header button{font:inherit;font-size:14px;color:inherit;background:none;border:0;cursor:pointer;padding:10px 7px;opacity:.55}
header button[aria-pressed="true"]{opacity:1;text-decoration:underline;text-underline-offset:6px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 6vw 64px;gap:8px}
svg{width:clamp(90px,12vw,130px);margin-bottom:28px}
.code{font-size:14px;letter-spacing:.2em;color:var(--mute)}
h1{font:300 clamp(34px,5vw,58px)/1.15 var(--serif);margin:6px 0 10px}
p{color:var(--mute);max-width:42ch;margin:0 0 30px}
a{color:var(--ink);text-decoration:none;border:1px solid var(--ink);padding:12px 28px;font-size:15px;transition:background .25s,color .25s}
a:hover{background:var(--ink);color:var(--bg)}
footer{padding:22px 5vw;text-align:center;color:var(--mute);font-size:13px;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
<header role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="tr">TR</button></header>
<main>
  <svg viewBox="170 559 478 338" role="img" aria-label="Cream &amp; Rouge"><g fill="none" stroke="currentColor" stroke-width="14"><path d="M460 647A146 146 0 1 0 340 872"/><path d="M461 745V881M454 583H540A85.5 85.5 0 0 1 540 754H515L621 881" stroke="var(--rouge)"/></g></svg>
  <span class="code">404</span>
  <h1 data-k="h"></h1>
  <p data-k="p"></p>
  <a href="/" data-k="a"></a>
</main>
<footer>© 2026 Cream &amp; Rouge</footer>
<script>
const T={en:{h:"This page doesn't exist",p:"The link may be broken or the page may have moved. You can find the collection and everything about us on the home page.",a:"Go to the home page"},
tr:{h:"Bu sayfa bulunamadı",p:"Bağlantı hatalı olabilir ya da sayfa taşınmış olabilir. Koleksiyonu ve bizimle ilgili her şeyi ana sayfada bulabilirsiniz.",a:"Ana sayfaya dön"}};
function setLang(l){document.documentElement.lang=l;document.querySelectorAll("[data-k]").forEach(e=>e.textContent=T[l][e.dataset.k]);
document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===l)));try{localStorage.setItem("lang",l)}catch(e){}}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
let sv=null;try{sv=localStorage.getItem("lang")}catch(e){}
setLang(sv||((navigator.language||"").toLowerCase().startsWith("tr")?"tr":"en"));
</script>
</body>
</html>
